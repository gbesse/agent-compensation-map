[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compensation-map"
version = "0.1.0a1"
description = "Compensations conditionnelles · Contingent compensations · Compensaciones condicionales"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
compensation-map = "compensation_map.__main__:main"

[tool.setuptools.packages.find]
include = ["compensation_map*"]

[tool.setuptools.package-data]
compensation_map = ["web/*", "examples/*"]
